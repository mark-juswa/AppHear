<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>self.ModelViewerElement={meshoptDecoderLocation:new URL('vendor/asl-decoders/meshopt_decoder.js',document.baseURI).href,ktx2TranscoderLocation:new URL('vendor/asl-decoders/basis/',document.baseURI).href};</script>
  <script type="module" src="vendor/model-viewer/model-viewer-4.3.1.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0D2020;
      overflow: hidden;
    }
    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0D2020;
      opacity: 0;
      transition: opacity 280ms ease;
      pointer-events: none;
    }
    model-viewer.active {
      opacity: 1;
      pointer-events: auto;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.72);
      font: 600 14px sans-serif;
      text-align: center;
    }
    model-viewer.defined ~ #fallback {
      display: none;
    }
  </style>
</head>
<body>
<model-viewer id="viewerA" class="active" camera-controls animation-crossfade-duration="250" exposure="1.0" shadow-intensity="0.35" camera-orbit="0deg 75deg 3m" camera-target="0m 1.5m 0m" field-of-view="45deg" min-camera-orbit="auto auto auto" max-camera-orbit="auto auto auto" interaction-prompt="none"></model-viewer>
<model-viewer id="viewerB" camera-controls animation-crossfade-duration="250" exposure="1.0" shadow-intensity="0.35" camera-orbit="0deg 75deg 3m" camera-target="0m 1.5m 0m" field-of-view="45deg" min-camera-orbit="auto auto auto" max-camera-orbit="auto auto auto" interaction-prompt="none"></model-viewer>
<div id="fallback">Avatar viewer is loading.</div>
<script src="pilot_player.js"></script>
</body>
</html>
