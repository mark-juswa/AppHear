# Phase 3 bridge — TFLite INT8 export of the streaming per-frame model. Post-training
# quantization calibrated on real normalized streaming features; float32 in/out, INT8 internals.

n_calib: 300          # representative-dataset samples for PTQ (drawn from train streaming features)
parity_batch: 512     # held-out val clips for the Keras-vs-TFLite drift check
schema_version: "3.0" # feature contract the artifact consumes (must match training)
calibration_temperature: 0.715  # streaming val calibration (carried into the manifest)

# GATE = the canonical post-training-quantization acceptance test: task metric preserved within
# tolerance + outputs faithful. Investigation (scratchpad) proved INT8's per-prediction churn is
# entirely sub-~10%-margin near-tie reshuffling (FLOAT/FLOAT16 exports = 1.000 retention; INT8 is
# exact for conf>=0.4), which nets to ~0 accuracy cost and which confirmation drops anyway. So we
# gate on accuracy + fidelity, and report the churn diagnostics (they explain, they don't gate).
max_clip_top1_delta: 0.01        # GATE: |top-1(Keras) - top-1(TFLite)| — accuracy preserved
max_mean_abs_prob_diff: 0.005    # GATE: mean |prob diff| — outputs faithful (guards coincidental acc)
commit_margin_floor: 0.05        # diagnostic only: clip margin above which a prediction is committable

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming"
model_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_v30"
confirm_config: "model/config/confirm.yaml"  # source of the operating point for the manifest
