# Feature 12 — confirmation policy (S7). Commit a sign when accumulated calibrated evidence is
# strong enough. Operating point (theta_conf) is chosen on the val operating curve for the
# target false-commit rate; theta_margin + k are the FP-guard gates.

temperature: 0.715        # calibrate per-frame posteriors (from the streaming val calibration)
k_stability: 3            # leading class must hold for k consecutive frames
theta_margin: 0.30        # min (A1 - A2) in cumulative-mean log-posterior space (FP guard)
target_false_commit: 0.05 # pick the val operating point at/under this false-commit rate

# operating-curve sweep over theta_conf (cumulative-mean log-posterior of the leading class):
theta_conf_grid: [-4.0, -3.5, -3.0, -2.5, -2.2, -2.0, -1.8, -1.6, -1.4, -1.2, -1.0]

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming"
model_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_v30"
