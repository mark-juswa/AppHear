# Feature 07 — isolated causal-TCN training configuration.
# The full multi-epoch run is executed by the developer (training is slow). All knobs here.

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3            # raised from 0.1 to fight the thin-per-class overfitting

train:
  seed: 0
  batch_size: 64
  epochs: 60
  learning_rate: 0.001
  early_stop_patience: 10   # on val top-1
  weight_decay: 0.0001      # AdamW L2 regularization
  label_smoothing: 0.1      # softens the 2731-class targets

# Train-only data augmentation (model/augment.py). Small perturbations the model must ignore.
augment:
  enabled: true
  rotation_deg: 10.0        # random in-plane rotation +/- deg
  scale: 0.10               # random scale +/- fraction
  noise_std: 0.01           # Gaussian coord noise (shoulder-width units)
  frame_mask_frac: 0.10     # fraction of frames zeroed per clip (temporal dropout)

# v3.0 feature arrays (stage F output) + where to write checkpoints/logs.
features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_isolated_v30"
