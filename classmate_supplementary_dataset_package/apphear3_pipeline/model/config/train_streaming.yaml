# Feature 11 — per-frame streaming trainer config. Same encoder/reg as isolated; per-frame head,
# warm-started from the isolated best.keras, trained on the real-timed (N4-off) features.

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3

train:
  seed: 0
  batch_size: 64
  epochs: 40
  learning_rate: 0.0005     # lower than isolated: fine-tuning a warm-started encoder
  early_stop_patience: 8    # on val per-frame accuracy
  weight_decay: 0.0001

# Geometric augmentation only (temporal frame-masking OFF — it would corrupt the real/pad mask).
augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

# Warm-start the shared causal-TCN encoder from the isolated run.
warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_isolated_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_v30"
