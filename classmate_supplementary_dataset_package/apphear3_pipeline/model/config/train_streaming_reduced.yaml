# Reduced-vocabulary streaming trainer — same encoder/reg as the full run, but trained on the
# top-N data-richest glosses (see pipeline/features/reduce_vocab.py) for a large accuracy win.
# Warm-starts the encoder from the FULL streaming model (already streaming-trained → strong init;
# the N-class head is fresh). num_classes comes from vocab_dir (the reduced vocab).

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3

train:
  seed: 0
  batch_size: 64
  epochs: 40
  learning_rate: 0.0005
  early_stop_patience: 8
  weight_decay: 0.0001

augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

# Encoder warm-start from the full streaming run (its TCN encoder is already streaming-trained).
warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming_reduced"
vocab_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_reduced"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_reduced_v30"
