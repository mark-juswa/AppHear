# Feature 03 — Normalization stack (N1 scale, N2 orientation, N3 handedness) configuration.
# These transforms define CANONICAL SPACE and are the #1 train/serve-parity surface: the exact
# same math must run in Android S4. Config-hashed (params_hash). Each sub-stage has a flag with
# a no-op fallback so it can be ablated independently (context/eval-protocol.md).

normalize_version: "n1"

# Sub-stage flags (each off = identity for that transform).
n1_scale: true          # translate to torso center + divide by shoulder width
n2_roll: true           # rotate so the shoulder line is horizontal (2D, reliable)
n2_yaw: false           # de-rotate torso yaw using world landmarks (flagged experiment, deferred)
n3_handedness: true     # mirror left-dominant signers so the dominant hand is canonical

# Handedness: if the two wrists' motion is within this relative fraction of each other, treat
# as symmetric and do NOT mirror (stable default). Dominant hand is canonicalized to the RIGHT.
handedness_epsilon: 0.15

# Inputs: stage-E landmarks + D2 spans (see extract.yaml / detect.yaml).
input_root: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/landmarks"
spans_root: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/spans"
output_root: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/norm"
