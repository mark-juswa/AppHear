# TCN retrain on ASL Citizen + local supplementary data.
# RTX 3050 4GB profile: conservative batch size. If CUDA runs out of memory, set batch_size to 16.
# This keeps the current v3.0 258-feature contract and current conversational vocabulary.

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3

train:
  seed: 0
  batch_size: 32
  epochs: 40
  learning_rate: 0.0005
  early_stop_patience: 8
  weight_decay: 0.0001

augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_fps_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming_conversational_plus_fps"
vocab_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_conversational_plus_experimental"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_rtx3050_v30"

