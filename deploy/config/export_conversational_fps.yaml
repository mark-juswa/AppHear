# TFLite INT8 export of the FPS-AUGMENTED conversational (236-word) model. Calibration draws from
# the fps-expanded conversational train set (so INT8 quant sees the low-fps distribution the phone
# produces). Larger parity_batch to average out benign near-tie churn on the fps-diverse val (same
# lesson as the reduced_fps export). calibration_temperature MUST match confirm + app.

