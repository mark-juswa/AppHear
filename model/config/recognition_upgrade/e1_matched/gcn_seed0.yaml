# E1 corrected full GCN, seed 0. Fresh training; no warm start.
model:
  type: gcn
  gcn_channels: [64, 64, 64, 64, 128, 128, 128, 256, 256, 256]
  gcn_early_strides: false
  gcn_mask_padded_frames: true
  gcn_infer_hand_presence: true
  gcn_pose_topology: mediapipe
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3
train:
  seed: 0
  batch_size: 64
  epochs: 60
  learning_rate: 0.0005
  early_stop_patience: 10
  weight_decay: 0.0001
augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0
features_dir: "../ASL CITIZEN/derived/apphear3/features_streaming_conversational_fps"
vocab_dir: "../ASL CITIZEN/derived/apphear3/features_conversational"
output_dir: "../ASL CITIZEN/derived/apphear3/runs/e1_matched_gcn_seed0_v30"
