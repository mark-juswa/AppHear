# Encoder-upgrade candidate A — FULL-CAPACITY ST-GCN on the conversational 236 vocab.
# Round-1 (half-width + EARLY strides + 51-keypoint subset, on prefix-aug data) badly failed the
# gate (native 0.159 vs TCN 0.612) — the speed shortcuts crushed temporal resolution/capacity and
# the prefix-augmented training data didn't match the clean eval. This round removes ALL the
# limiting:
#   - full width (paper-size 64-128-256, ~2.75M params)
#   - LATE temporal strides {4,7} (keep full time resolution through the early blocks)
#   - all 75 keypoints (no subset gather)
#   - trained on features_streaming_conversational_fps — the SAME data the TCN used (fair
#     comparison; NO prefix augmentation, which is a deployment concern, not a gate concern)
#   - fresh start in a NEW run dir (the round-1 best.keras is a different, smaller architecture)
# Slower per epoch on CPU (no speed cuts) — that is the deliberate trade for a fair test.
# oneDNN is disabled in the entry point (model/train_streaming.py) so the non-AVX-512 CPU won't
# segfault. Self-resumes from this run's own best.keras after a Ctrl+C.

model:
  type: gcn
  gcn_channels: [64, 64, 64, 64, 128, 128, 128, 256, 256, 256]  # full width
  gcn_early_strides: false   # LATE strides {4,7} (default) — early strides were the main killer
  gcn_mask_padded_frames: true
  gcn_infer_hand_presence: true
  gcn_pose_topology: mediapipe
  # gcn_keypoints omitted -> all 75 keypoints
  dropout: 0.3
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3

train:
  seed: 0
  batch_size: 64
  epochs: 60
  learning_rate: 0.0005
  early_stop_patience: 10
  weight_decay: 0.0001

augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

# Self-resume from this run's own checkpoint (empty on first run -> fresh start).
warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/gcn_conversational_full_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming_conversational_fps"
vocab_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_conversational"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/gcn_conversational_full_v30"
