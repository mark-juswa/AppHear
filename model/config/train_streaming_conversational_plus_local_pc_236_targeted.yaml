# Targeted low-FPS confusion experiment for the 236-class local-supplementary candidate.
# This is a separate run. It does not overwrite the current Android assets or baseline run.
# Rationale from artifacts/targeted_confusion_audit_20260722:
# - Low-FPS phone failures match offline weak classes and early-frame weakness.
# - Weak held-out last-frame classes: KNOW, HELLO, SELL, WANT2, PUT.
# - Use mild loss weights only; validation remains unweighted for comparable eval.

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3

train:
  seed: 7
  batch_size: 64
  epochs: 40
  learning_rate: 0.00025
  early_stop_patience: 8
  weight_decay: 0.0001

augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

# Config-gated experiment. Normal training configs ignore this block.
# Keep weights moderate to reduce catastrophic regressions in stable classes.
class_weighting:
  enabled: true
  weights:
    KNOW: 3.0
    HELLO: 2.5
    SELL: 2.5
    WANT2: 2.0
    PUT: 2.0
    WAIT: 1.5
    MANY: 1.5
    IMPORTANT: 1.5
    SHOP1: 1.5

warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_rtx3050_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming_conversational_plus_pc_236_fps"
vocab_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_rtx3050_v30/android_candidate_assets"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_targeted_v1"
