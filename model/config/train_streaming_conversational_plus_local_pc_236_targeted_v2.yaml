# Targeted low-FPS confusion experiment v2 for the 236-class local-supplementary candidate.
# Separate run; does not overwrite Android assets, baseline, or targeted_v1.
# v1 proved the approach but over-corrected: KNOW/SELL/WANT2 improved while WE/WAIT/MANY/FAMILY/SHOP1 regressed.
# v2 uses softer weak-class weights and guardrail weights for regressed stable classes.

model:
  blocks: 4
  channels: 64
  dilations: [1, 2, 4, 8]
  kernel: 3
  dropout: 0.3

train:
  seed: 11
  batch_size: 64
  epochs: 40
  learning_rate: 0.00020
  early_stop_patience: 8
  weight_decay: 0.0001

augment:
  enabled: true
  rotation_deg: 10.0
  scale: 0.10
  noise_std: 0.01
  frame_mask_frac: 0.0

# Config-gated experiment. Validation remains unweighted for comparable eval.
# Softer than v1 to reduce probability pull away from stable classes.
class_weighting:
  enabled: true
  weights:
    KNOW: 2.5
    HELLO: 2.0
    SELL: 2.0
    WANT2: 1.6
    PUT: 1.6
    WAIT: 1.6
    MANY: 1.5
    SHOP1: 1.5
    FAMILY: 1.3
    WE: 1.3
    IMPORTANT: 1.3

warm_start_from: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_rtx3050_v30/best.keras"

features_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/features_streaming_conversational_plus_pc_236_fps"
vocab_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_rtx3050_v30/android_candidate_assets"
output_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/runs/tcn_streaming_conversational_plus_local_pc_236_targeted_v2"
