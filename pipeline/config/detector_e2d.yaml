experiment_version: "e2d.detector_operating_point.v0.1"
seed: 260726

dataset:
  root: "F:/ASL DATASET/ASL CITIZEN/ASL_Citizen"
  videos_subdir: "videos"

source_positive:
  run_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/recognition_upgrade/e2b_roi_recovery_v0/engineering_e2b_01"

source_negative:
  run_dir: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/recognition_upgrade/e2_crop_quality_v0/engineering_run_02"
  audit_csv: "audit_template_consistency_corrected.csv"

output:
