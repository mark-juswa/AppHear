  - {id: "video_d30_p30", mode: "video", detection: 0.3, presence: 0.3}

gates:
  control_candidate: "image_d50_p50"
  min_positive_recall_gain: 0.20
  max_negative_false_roi_rate: 0.05
  max_negative_false_roi_increase: 0.02
  max_candidate_to_control_p95_latency_ratio: 1.20
  require_no_hand_or_cadence_regression: true
