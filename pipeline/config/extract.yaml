# Feature 01 — Landmark extraction (E) configuration.
# All thresholds live here, never inline (context/code-standards.md).
# The resolved values below are hashed into every clip sidecar (model_config_hash) so a
# later change forces config-driven re-extraction rather than silent drift.

extraction_version: "e1"

dataset:
  # ASL Citizen root (contains ASL_Citizen/{splits,videos})
  root: "F:/ASL DATASET/ASL CITIZEN/ASL_Citizen"
  videos_subdir: "videos"
  splits_subdir: "splits"
  source: "asl_citizen"

output:
  # Derived landmark data lives OFF the code drive, next to the dataset.
  root: "F:/ASL DATASET/ASL CITIZEN/derived/apphear3/landmarks"

models:
  # Fetched by pipeline/extract/assets.py — not committed.
  hand_task: "assets/mediapipe/hand_landmarker.task"
  pose_task: "assets/mediapipe/pose_landmarker_lite.task"   # LITE — mobile-realistic (locked decision)

hand:
  num_hands: 2
  min_hand_detection_confidence: 0.5   # MediaPipe default — tuned later with the quality gate (Q)
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5

pose:
  num_poses: 1
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5
